name: benchmark-phase5-peak-rss

on:
  push:
    branches:
      - benchmark/phase5-release-peak-rss

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Print environment
        run: |
          uname -a
          lscpu | sed -n '1,24p'
          free -m
          uv run python --version
      - name: Run Phase-5 recognition benchmark
        run: uv run python scripts/benchmark_peak_rss.py --repeats 5
      - name: Show benchmark artifact
        run: cat formal_artifacts/benchmark_peak_rss.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-benchmark-peak-rss-${{ github.sha }}
          path: formal_artifacts/benchmark_peak_rss.json
