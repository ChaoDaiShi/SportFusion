server
{
    listen 80;
    listen [::]:80;
    server_name 1.14.96.15;
    index index.html;
    root /www/DaShuJu/frontend/dist;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/1.14.96.15.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #ERROR-PAGE-END

    # 宝塔扩展配置入口
    include /www/server/panel/vhost/nginx/extension/1.14.96.15/*.conf;

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    # ============================================================
    # API 反向代理 → Python 后端 (127.0.0.1:8000)
    # ============================================================
    location ^~ /api/
    {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（智能助手必需！）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 超时时间（大文件上传 + AI流式对话）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        # API 响应不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============================================================
    # API 文档（可选，生产建议注释掉）
    # ============================================================
    location /docs
    {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc
    {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json
    {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # 静态资源缓存（带 hash 的文件名，可长期缓存）
    # ============================================================
    location /assets/
    {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg|ico)$
    {
        expires 30d;
    }

    location ~ .*\.(js|css|woff2?|ttf|eot)$
    {
        expires 7d;
    }

    # ============================================================
    # SPA 路由回退 — 所有非文件路径返回 index.html
    # ============================================================
    location /
    {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/1.14.96.15.log;
    error_log /www/wwwlogs/1.14.96.15.error.log;
}
