# ============================================================
# 体育产业测算平台 — Nginx 站点配置
# 部署路径: /etc/nginx/sites-available/sports-industry
# 启用: ln -s /etc/nginx/sites-available/sports-industry /etc/nginx/sites-enabled/
# ============================================================

# 前端静态资源缓存优化
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    application/json           off;
    image/svg+xml              max;
    image/png                  max;
    image/jpeg                 max;
    image/gif                  max;
    image/x-icon               max;
    font/woff2                 max;
}

server {
    listen 80;
    server_name _;                         # 改为你的域名，如 example.com

    # 日志
    access_log /var/log/nginx/sports-industry-access.log;
    error_log  /var/log/nginx/sports-industry-error.log;

    # 客户端上传大小限制（数据文件可能较大）
    client_max_body_size 100m;

    # ========== 前端静态文件 ==========
    root /opt/sports-industry/frontend/dist;
    index index.html;

    # 静态资源强缓存（带 hash 的文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # SPA 路由回退 — 所有非 API 路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires $expires;
    }

    # ========== API 反向代理 ==========
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（智能助手流式对话需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 超时（大文件上传+AI流式对话需要较长时间）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        # 不缓存 API 响应
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ========== API 文档（可选的，生产环境建议注释掉） ==========
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========== 安全加固 ==========
    # 隐藏 Nginx 版本
    server_tokens off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
